[metadata]
name = agent-regression-kit
version = attr: agent_regression.version.__version__
description = Turn agent runs into deterministic regression evidence.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.extras_require]
pydantic-ai =
    pydantic-ai-slim>=1,<2; python_version >= "3.10"
openai-agents =
    openai-agents>=0.8,<1; python_version >= "3.10"
langgraph =
    langgraph>=1,<2; python_version >= "3.10"
    langchain-core>=1,<2; python_version >= "3.10"
frameworks =
    pydantic-ai-slim>=1,<2; python_version >= "3.10"
    openai-agents>=0.8,<1; python_version >= "3.10"
    langgraph>=1,<2; python_version >= "3.10"
    langchain-core>=1,<2; python_version >= "3.10"


[options.packages.find]
where = src

[options.data_files]
share/agent-regression-kit/viewer =
    viewer/index.html
    viewer/config.html
    viewer/reports.html
    viewer/workspace.html
share/agent-regression-kit/docs =
    docs/agent-regression-kit-guide.html
