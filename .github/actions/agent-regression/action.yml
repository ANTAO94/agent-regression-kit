name: Agent Regression
description: Compare an Agent Regression Kit candidate trace with a reviewed baseline.
inputs:
  config:
    description: Optional project comparison config. When set, baseline/candidate and contract are read from this file.
    required: false
    default: ""
  baseline:
    description: Path to the reviewed baseline AgentTrace JSON file.
    required: false
  candidate:
    description: Path to the candidate AgentTrace JSON file.
    required: false
  report:
    description: Path for the JUnit report.
    required: false
    default: outputs/agent-regression.junit.xml
  summary:
    description: Path for the Markdown summary and optional GitHub step summary.
    required: false
    default: outputs/agent-regression.md
  json-report:
    description: Path for the machine-readable comparison JSON report.
    required: false
    default: outputs/agent-regression.json
  allow-category:
    description: Optional comma-separated difference categories to allow.
    required: false
    default: ""
  allow-path:
    description: Optional comma-separated exact difference paths to allow.
    required: false
    default: ""
  final-answer-mode:
    description: Compare final prose exactly or compare only structured claims.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Compare AgentTrace evidence
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        REPORT: ${{ inputs.report }}
        SUMMARY: ${{ inputs.summary }}
        JSON_REPORT: ${{ inputs['json-report'] }}
        ALLOW_CATEGORY: ${{ inputs['allow-category'] }}
        ALLOW_PATH: ${{ inputs['allow-path'] }}
        FINAL_ANSWER_MODE: ${{ inputs['final-answer-mode'] }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$REPORT")"
        mkdir -p "$(dirname "$SUMMARY")"
        mkdir -p "$(dirname "$JSON_REPORT")"
        if [[ -n "$CONFIG" ]]; then
          args=(compare --config "$CONFIG")
        else
          if [[ -z "$BASELINE" || -z "$CANDIDATE" ]]; then
            echo "agent-regression: config or both baseline/candidate inputs are required" >&2
            exit 2
          fi
          args=(compare --baseline "$BASELINE" --candidate "$CANDIDATE")
        fi
        if [[ -n "$ALLOW_CATEGORY" ]]; then
          IFS=',' read -r -a categories <<< "$ALLOW_CATEGORY"
          for category in "${categories[@]}"; do
            args+=(--allow-category "$category")
          done
        fi
        if [[ -n "$ALLOW_PATH" ]]; then
          IFS=',' read -r -a paths <<< "$ALLOW_PATH"
          for path in "${paths[@]}"; do
            args+=(--allow-path "$path")
          done
        fi
        if [[ -n "$FINAL_ANSWER_MODE" ]]; then
          args+=(--final-answer-mode "$FINAL_ANSWER_MODE")
        fi
        set +e
        agent-regression "${args[@]}" --format junit --out "$REPORT"
        comparison_status=$?
        agent-regression "${args[@]}" --format markdown --out "$SUMMARY"
        markdown_status=$?
        agent-regression "${args[@]}" --format json --out "$JSON_REPORT"
        json_status=$?
        set -e
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f "$SUMMARY" ]]; then
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ "$comparison_status" -ne 0 ]]; then
          exit "$comparison_status"
        fi
        if [[ "$markdown_status" -ne 0 ]]; then
          exit "$markdown_status"
        fi
        exit "$json_status"
