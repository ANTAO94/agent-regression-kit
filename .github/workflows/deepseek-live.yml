name: DeepSeek live provider

on:
  workflow_dispatch:
  schedule:
    # Sunday is outside the weekday peak-price window documented by DeepSeek.
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: deepseek-live-provider
  cancel-in-progress: false

jobs:
  live-tool-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the provider secret
        run: test -n "$DEEPSEEK_API_KEY"
      - name: Install the dependency-free core
        run: python -m pip install .
      - name: Run one low-cost live tool Agent
        run: python examples/deepseek_live_agent_example.py
      - name: Validate and compare live evidence
        run: |
          agent-regression validate --trace work/deepseek-live.trace.json
          agent-regression compare --config examples/deepseek-live/compare.config.json
      - name: Assert the secret is absent from artifacts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secret = os.environ["DEEPSEEK_API_KEY"]
          for path in Path("work").glob("deepseek-live*.json"):
              if secret in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"secret found in {path}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-live-regression-evidence
          path: work/deepseek-live*.json
          retention-days: 7
