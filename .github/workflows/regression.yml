name: agent-regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install
        id: install
        run: python -m pip install --no-build-isolation .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Record candidate through the local MCP fixture
        run: >-
          agent-regression mcp-record
          --scenario examples/order-123/candidate-ok.scenario.json
          --out work/candidate.trace.json
      - name: Preflight comparison inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-regression
          python - <<'PY'
          import json
          from pathlib import Path
          Path('.agent-regression/ci.json').write_text(json.dumps({
              'baseline': 'baselines/order-123.trace.json',
              'candidate': 'work/candidate.trace.json',
              'contract': {
                  'required_claims': ['final_answer.claims.order_status'],
                  'must_call': [{'tool': 'get_order'}],
              },
          }) + '\n', encoding='utf-8')
          PY
          agent-regression check --config .agent-regression/ci.json --kind single
      - name: Block structural regressions
        uses: ./.github/actions/agent-regression
        with:
          config: .agent-regression/ci.json
          report: work/ci-reports/order-123.junit.xml
          summary: work/ci-reports/order-123.md
          json-report: work/ci-reports/order-123.compare.json
      - name: Record stability evidence
        if: always() && steps.install.outcome == 'success'
        run: >-
          agent-regression stability
          --baseline baselines/order-123.trace.json
          --scenario examples/order-123/candidate-ok.scenario.json
          --repeats 3
          --workers 2
          --out work/ci-reports/order-123.stability.json
      - name: Record sampling uncertainty evidence
        if: always() && steps.install.outcome == 'success'
        run: >-
          agent-regression stability
          --baseline baselines/order-123.trace.json
          --scenario examples/order-123/candidate-ok.scenario.json
          --repeats 30
          --workers 4
          --min-runs 30
          --out work/ci-reports/order-123.sampling.json
      - name: Record coverage evidence
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/scenarios
          cp work/candidate.trace.json work/scenarios/order-123.trace.json
          agent-regression coverage \
            --trace-dir work/scenarios \
            --expected-path get_order \
            --format json \
            --out work/ci-reports/order-123.coverage.json
      - name: Aggregate history evidence
        if: always() && steps.install.outcome == 'success'
        run: >-
          agent-regression history
          --report-dir work/ci-reports
          --format json
          --out work/ci-reports/history.json
      - name: Build report index for reviewers
        if: always() && steps.install.outcome == 'success'
        uses: ./.github/actions/agent-report-index
        with:
          report-dir: work/ci-reports
          json-report: work/ci-reports/report-index.json
          markdown-report: work/ci-reports/report-index.md
          fail-on-regression: 'true'
          required-reports: order-123.compare.json,order-123.stability.json,order-123.sampling.json,order-123.coverage.json,history.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-regression-report
          path: work/ci-reports/
