name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build source distribution and wheel
        run: python -m build
      - name: Generate release checksums and SPDX SBOM
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(PYTHONPATH=src python -c 'from agent_regression import __version__; print(__version__)')"
          python scripts/generate_release_metadata.py \
            --dist-dir dist \
            --version "$release_version"
          echo "sbom=dist/agent-regression-kit-${release_version}.spdx.json" >> "$GITHUB_OUTPUT"
      - name: Verify wheel in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/agent-regression-release-venv
          /tmp/agent-regression-release-venv/bin/pip install dist/*.whl
          /tmp/agent-regression-release-venv/bin/agent-regression --version
          /tmp/agent-regression-release-venv/bin/agent-regression ui --help
          /tmp/agent-regression-release-venv/bin/agent-regression readiness --help
          /tmp/agent-regression-release-venv/bin/agent-regression compatibility \
            --public-api-version 4 \
            --trace baselines/order-123.trace.json \
            --config examples/quickstart/compare.config.json \
            --out /tmp/agent-regression-compatibility.json
          /tmp/agent-regression-release-venv/bin/agent-regression migrate trace \
            --trace baselines/order-123.trace.json \
            --out /tmp/agent-regression-migrated.trace.json \
            --report /tmp/agent-regression-migration.json
          /tmp/agent-regression-release-venv/bin/agent-regression validate \
            --trace /tmp/agent-regression-migrated.trace.json
          /tmp/agent-regression-release-venv/bin/agent-regression workspace manifest \
            --directory . --out /tmp/agent-regression-workspace.json
          /tmp/agent-regression-release-venv/bin/python -c \
            'from agent_regression import __version__; print(__version__)'
          DOC_ROOT="$(/tmp/agent-regression-release-venv/bin/python -c 'import sys; print(sys.prefix)')/share/agent-regression-kit/docs"
          test -f "$DOC_ROOT/UPGRADING.md"
          test -f "$DOC_ROOT/compatibility-matrix.md"
          test -f "$DOC_ROOT/api.md"
          test -f "$DOC_ROOT/architecture.md"
          test -f "$DOC_ROOT/limitations.md"
          test -f "$DOC_ROOT/maturity-roadmap.md"
          test -f "$DOC_ROOT/maturity-evolution-plan.zh-CN.md"
          test -f "$DOC_ROOT/product-iteration-plan.zh-CN.md"
          test -f "$DOC_ROOT/p1-langgraph-agent-stack-validation.md"
          test -f "$DOC_ROOT/v4-acceptance.md"
          test -f "$DOC_ROOT/v4.1-acceptance.md"
          test -f "$DOC_ROOT/v4.2-acceptance.md"
          test -f "$DOC_ROOT/v4.3-acceptance.md"
          test -f "$DOC_ROOT/v4.4-acceptance.md"
          test -f "$DOC_ROOT/v4.5-acceptance.md"
          test -f "$DOC_ROOT/v4.6-acceptance.md"
          test -f "$DOC_ROOT/v4.7-acceptance.md"
          test -f "$DOC_ROOT/v4.8-acceptance.md"
          test -f "$DOC_ROOT/v4.9-acceptance.md"
          test -f "$DOC_ROOT/v4.10-acceptance.md"
          test -f "$DOC_ROOT/v4.11-acceptance.md"
          test -f "$DOC_ROOT/v4.12-acceptance.md"
          test -f "$DOC_ROOT/v4.13-acceptance.md"
          test -f "$DOC_ROOT/v4.14-acceptance.md"
          test -f "$DOC_ROOT/v4.15-acceptance.md"
          test -f "$DOC_ROOT/v4.16-acceptance.md"
          test -f "$DOC_ROOT/v4.17-acceptance.md"
          test -f "$DOC_ROOT/v4.18-acceptance.md"
          test -f "$DOC_ROOT/v4.19-acceptance.md"
          test -f "$DOC_ROOT/v4.20-acceptance.md"
          test -f "$DOC_ROOT/v4.21-acceptance.md"
          test -f "$DOC_ROOT/v4.22-acceptance.md"
          test -f "$DOC_ROOT/v4.23-acceptance.md"
          test -f "$DOC_ROOT/v4.24-acceptance.md"
          test -f "$DOC_ROOT/v4.25-acceptance.md"
          test -f "$DOC_ROOT/v4.26-acceptance.md"
          test -f "$DOC_ROOT/v4.27-acceptance.md"
          test -f "$DOC_ROOT/v4.28-acceptance.md"
          test -f "$DOC_ROOT/v4.29-acceptance.md"
          test -f "$DOC_ROOT/v4.30-acceptance.md"
          test -f "$DOC_ROOT/v4.31-acceptance.md"
          test -f "$DOC_ROOT/v4.32-acceptance.md"
          test -f "$DOC_ROOT/v4.33-acceptance.md"
          test -f "$DOC_ROOT/v4.34-acceptance.md"
          test -f "$DOC_ROOT/v4.35-acceptance.md"
          test -f "$DOC_ROOT/v4.36-acceptance.md"
          test -f "$DOC_ROOT/readiness-audit.md"
          test -f "$DOC_ROOT/performance.md"
          test -f "$DOC_ROOT/consumer-pilot.md"
          test -f "$DOC_ROOT/state-equivalence.md"
          test -f "$DOC_ROOT/framework-integrations.md"
          test -f "$DOC_ROOT/deepseek-live.md"
          test -f "$DOC_ROOT/tau2-independent-validation.md"
          test -f "$DOC_ROOT/supply-chain.md"
          VIEWER_ROOT="$(/tmp/agent-regression-release-venv/bin/python -c 'import sys; print(sys.prefix)')/share/agent-regression-kit/viewer"
          test -f "$VIEWER_ROOT/reports.html"
          test -f "$VIEWER_ROOT/workspace.html"
      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest release SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: ${{ steps.release-metadata.outputs.sbom }}
      - name: Create GitHub release for a pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agent-regression-kit-${{ github.ref_name }}
          path: dist/
