name: Reviewed case lifecycle (HelpPilot)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/agent_regression/**"
      - "tests/**"
      - "schema/**"
      - "setup.cfg"
      - "examples/external-pilot/helppilot/**"
      - ".github/workflows/case-lifecycle.yml"
  push:
    paths:
      - "src/agent_regression/**"
      - "tests/**"
      - "schema/**"
      - "setup.cfg"
      - "examples/external-pilot/helppilot/**"
      - ".github/workflows/case-lifecycle.yml"

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Build the consumer wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Pin independent HelpPilot and install the wheel
        run: |
          git clone https://github.com/poysa213/HelpPilot.git "$RUNNER_TEMP/helppilot"
          git -C "$RUNNER_TEMP/helppilot" checkout 3767824fb90b89a8b19fc4169d912645aaf6fe0b
          uv sync --directory "$RUNNER_TEMP/helppilot"
          uv pip install --python "$RUNNER_TEMP/helppilot/.venv/bin/python" "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Verify failure, review, fresh recovery and closure
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/helppilot/.venv/bin/python" examples/external-pilot/helppilot/run_lifecycle.py \
            --project-dir "$RUNNER_TEMP/helppilot" --root "$RUNNER_TEMP/case-bundle"
          "$RUNNER_TEMP/helppilot/.venv/bin/agent-regression" incident report \
            --root "$RUNNER_TEMP/case-bundle" --incident incident.json \
            --resolution resolutions/refund.json --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Reproduce the toolkit adapter historical false negative
        env:
          PYTHONPATH: ""
        run: |
          "$RUNNER_TEMP/helppilot/.venv/bin/python" scripts/reproduce_helppilot_history.py \
            --out "$RUNNER_TEMP/adapter-history"
      - name: Retain original evidence and closure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helppilot-case-lifecycle
          path: |
            ${{ runner.temp }}/case-bundle
            ${{ runner.temp }}/adapter-history
          if-no-files-found: error
