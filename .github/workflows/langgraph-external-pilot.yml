name: LangGraph external pilot

on:
  workflow_dispatch:
  push:
    paths:
      - "src/agent_regression/framework_integrations.py"
      - "tests/test_framework_integrations.py"
      - "examples/external-pilot/langgraph-agent-stack/**"
      - ".github/workflows/langgraph-external-pilot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Agent Regression Kit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build the wheel used by the independent candidate environment
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist

      - name: Check out the pinned independent LangGraph project
        env:
          CANDIDATE_COMMIT: a8a2dac566d46c48619ba94c69dfffb1b370520d
        run: |
          git clone https://github.com/Brescou/langgraph-agent-stack.git "$RUNNER_TEMP/langgraph-agent-stack"
          git -C "$RUNNER_TEMP/langgraph-agent-stack" checkout "$CANDIDATE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/langgraph-agent-stack" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          uv sync --directory "$RUNNER_TEMP/langgraph-agent-stack"
          uv pip install --python "$RUNNER_TEMP/langgraph-agent-stack/.venv/bin/python" "$GITHUB_WORKSPACE"/dist/*.whl

      - name: Verify the installed wheel is outside the source checkout
        working-directory: ${{ runner.temp }}/langgraph-agent-stack
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import agent_regression

          location = Path(agent_regression.__file__).resolve()
          assert "/src/agent_regression/" not in str(location), location
          assert version("agent-regression-kit") == "4.36.0"
          print(f"agent-regression-kit {version('agent-regression-kit')} from {location}")
          PY

      - name: Run the candidate's own deterministic eval
        working-directory: ${{ runner.temp }}/langgraph-agent-stack
        run: |
          LLM_PROVIDER=mock SEARCH_PROVIDER=mock \
            .venv/bin/python -m evals --all --json --thresholds

      - name: Compare a fresh candidate with the reviewed baseline
        env:
          KIT: ${{ github.workspace }}
          STACK: ${{ runner.temp }}/langgraph-agent-stack
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/agent-regression-langgraph-pilot"
          mkdir -p "$WORK"
          PY="$STACK/.venv/bin/python"
          CAP="$KIT/examples/external-pilot/langgraph-agent-stack/capture_trace.py"
          FIXTURE="$KIT/examples/external-pilot/langgraph-agent-stack/research-fixture.json"
          REVIEWED_BASELINE="$KIT/examples/external-pilot/langgraph-agent-stack/baseline.trace.json"
          CONFIG="$KIT/examples/external-pilot/langgraph-agent-stack/compare.config.json"

          cp "$REVIEWED_BASELINE" "$WORK/baseline.trace.json"
          test -s "$WORK/baseline.trace.json"
          "$PY" -m agent_regression validate --trace "$WORK/baseline.trace.json" >/dev/null
          "$PY" - "$WORK/baseline.trace.json" "$FIXTURE" <<'PY'
          import hashlib
          import json
          import sys

          baseline = json.load(open(sys.argv[1], encoding="utf-8"))
          fixture_hash = hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest()
          assert baseline["agent"]["fixture_sha256"] == fixture_hash
          PY
          "$PY" "$CAP" --project-dir "$STACK" --run-id candidate \
            --fixture "$FIXTURE" \
            --output "$WORK/candidate.trace.json" | tee "$WORK/candidate.capture.json"
          "$PY" -m agent_regression compare --config "$CONFIG" \
            --baseline "$WORK/baseline.trace.json" \
            --candidate "$WORK/candidate.trace.json" \
            --out "$WORK/normal.compare.json"

          "$PY" "$CAP" --project-dir "$STACK" --run-id wording \
            --vary-presentation --output "$WORK/wording.trace.json"
          "$PY" -m agent_regression compare --config "$CONFIG" \
            --baseline "$WORK/baseline.trace.json" \
            --candidate "$WORK/wording.trace.json" \
            --out "$WORK/wording.compare.json"

          "$PY" "$CAP" --project-dir "$STACK" --run-id evidence-order \
            --vary-evidence-order --output "$WORK/evidence-order.trace.json"
          "$PY" -m agent_regression compare --config "$CONFIG" \
            --baseline "$WORK/baseline.trace.json" \
            --candidate "$WORK/evidence-order.trace.json" \
            --out "$WORK/evidence-order.compare.json"

          expect_regression() {
            local name="$1"
            local expected_category="$2"
            shift 2
            "$PY" "$CAP" --project-dir "$STACK" --run-id "$name" "$@" \
              --fixture "$FIXTURE" \
              --output "$WORK/$name.trace.json"
            set +e
            "$PY" -m agent_regression compare --config "$CONFIG" \
              --baseline "$WORK/baseline.trace.json" \
              --candidate "$WORK/$name.trace.json" \
              --out "$WORK/$name.compare.json"
            local code=$?
            set -e
            test "$code" -eq 1
            "$PY" - "$WORK/$name.compare.json" "$expected_category" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          categories = {
              item["category"]
              for item in report["differences"]
              if not item["allowed"]
          }
          assert expected in categories, (expected, sorted(categories))
          PY
          }

          expect_regression wrong-query required_tool --mutate-search-query "unrelated topic"
          expect_regression skipped-search tool_count --skip-search
          expect_regression misread contract_assertion --misread-fact checkpointer_scope

      - name: Upload traces and compare reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langgraph-external-pilot
          path: ${{ runner.temp }}/agent-regression-langgraph-pilot
