            --output work/tau2-airline/results.json \
            "https://raw.githubusercontent.com/sierra-research/tau2-bench/v1.0.1/data/tau2/results/final/gpt-4.1-mini-2025-04-14_airline_base_gpt-4.1-2025-04-14_4trials.json"
          echo "41788956547a100fb8e34baf159f36dd1f07f0765798a5fdaf917576c5dba9d0  work/tau2-airline/results.json" \
            | shasum -a 256 -c -
      - name: Evaluate the unseen airline task domain
        run: |
          python examples/tau2_airline_validation.py \
            --results work/tau2-airline/results.json \
            --out work/tau2-airline/report.json \
            --traces-dir work/tau2-airline/sample-traces \
            --min-eligible 100 \
            --min-failures 50 \
            --min-failure-recall 0.99 \
            --max-false-alarm-rate 0.05 \
            --max-missed-failure-rate 0.0
      - name: Publish the airline validation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("work/tau2-airline/report.json"))
          scope = report["scope"]
          matrix = report["confusion_matrix"]
          metrics = report["metrics"]
          print("## tau2-bench independent airline validation")
          print()
          print(f"- Eligible write scenarios: {scope['eligible_write_scenarios']}")
          print(f"- Oracle failures: {matrix['true_block'] + matrix['missed_failure']}")
          print(f"- Failure recall: {metrics['failure_recall']:.2%}")
          print(f"- False alarm rate: {metrics['false_alarm_rate']:.2%}")
          print(f"- Results SHA-256: {report['provenance']['results']['results_sha256']}")
