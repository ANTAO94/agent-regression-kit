            --min-failures 50 \
            --min-failure-recall 0.99 \
            --max-false-alarm-rate 0.05 \
            --max-missed-failure-rate 0.0
      - name: Publish the prospective evaluation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
