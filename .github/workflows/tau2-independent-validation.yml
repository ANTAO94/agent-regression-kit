name: tau2 independent validation

on:
  pull_request:
    paths:
      - "src/agent_regression/tau2.py"
      - "src/agent_regression/contracts.py"
      - "src/agent_regression/compare.py"
      - "examples/tau2_retail_validation.py"
      - "examples/tau2-retail/**"
      - "examples/tau2_airline_validation.py"
      - "examples/tau2-airline/**"
      - "tests/test_tau2.py"
      - "tests/test_contracts.py"
      - ".github/workflows/tau2-independent-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/agent_regression/tau2.py"
      - "src/agent_regression/contracts.py"
      - "src/agent_regression/compare.py"
      - "examples/tau2_retail_validation.py"
      - "examples/tau2-retail/**"
      - "examples/tau2_airline_validation.py"
      - "examples/tau2-airline/**"
      - "tests/test_tau2.py"
      - "tests/test_contracts.py"
      - ".github/workflows/tau2-independent-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-retail-trajectories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Agent Regression Kit
        run: python -m pip install .
      - name: Download the pinned upstream result file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tau2
          curl --fail --location --retry 3 \
            --output work/tau2/results.json \
            "https://raw.githubusercontent.com/sierra-research/tau2-bench/v1.0.1/data/tau2/results/final/gpt-4.1-mini-2025-04-14_retail_base_gpt-4.1-2025-04-14_4trials.json"
          echo "6d6badb43b716adca31591b0b40e15fd493b49adddaa8e2c47035bb557549257  work/tau2/results.json" \
            | shasum -a 256 -c -
      - name: Compare contract decisions with the independent tau2 oracle
        run: |
          python examples/tau2_retail_validation.py \
            --results work/tau2/results.json \
            --out work/tau2/report.json \
            --traces-dir work/tau2/sample-traces
      - name: Publish the validation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("work/tau2/report.json"))
          scope = report["scope"]
          matrix = report["confusion_matrix"]
          metrics = report["metrics"]
          print("## tau2-bench independent validation")
          print()
          print(f"- Eligible write scenarios: {scope['eligible_write_scenarios']}")
          print(f"- Correct failures blocked: {matrix['true_block']}")
          print(f"- Missed failures: {matrix['missed_failure']}")
          print(f"- False alarms: {matrix['false_alarm']}")
          print(f"- Accuracy: {metrics['accuracy']:.2%}")
          print(f"- Failure recall: {metrics['failure_recall']:.2%}")
          print(f"- False alarm rate: {metrics['false_alarm_rate']:.2%}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tau2-independent-validation
          path: work/tau2/

  prospective-o4-retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Agent Regression Kit
        run: python -m pip install .
      - name: Download the prospective model result file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tau2-prospective
          curl --fail --location --retry 3 \
            --output work/tau2-prospective/results.json \
            "https://raw.githubusercontent.com/sierra-research/tau2-bench/v1.0.1/data/tau2/results/final/o4-mini-2025-04-16_retail_default_gpt-4.1-2025-04-14_4trials.json"
          echo "7135f38bbbbd46d6babe830574c8623bb276d8fd6da316580b905cf513853f98  work/tau2-prospective/results.json" \
            | shasum -a 256 -c -
      - name: Evaluate the prospective model holdout
        run: |
          python examples/tau2_retail_validation.py \
            --results work/tau2-prospective/results.json \
            --source-manifest examples/tau2-retail/prospective-o4-mini-source.json \
            --out work/tau2-prospective/report.json \
            --traces-dir work/tau2-prospective/sample-traces \
            --min-eligible 300 \
            --min-failures 50 \
            --min-failure-recall 0.99 \
            --max-false-alarm-rate 0.05 \
            --max-missed-failure-rate 0.0
      - name: Publish the prospective evaluation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("work/tau2-prospective/report.json"))
          scope = report["scope"]
          matrix = report["confusion_matrix"]
          metrics = report["metrics"]
          print("## tau2-bench prospective model evaluation")
          print()
          print(f"- Eligible write scenarios: {scope['eligible_write_scenarios']}")
          print(f"- Oracle failures: {matrix['true_block'] + matrix['missed_failure']}")
          print(f"- Failure recall: {metrics['failure_recall']:.2%}")
          print(f"- False alarm rate: {metrics['false_alarm_rate']:.2%}")
          print(f"- Results SHA-256: {report['provenance']['results']['results_sha256']}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tau2-prospective-o4-retail
          path: work/tau2-prospective/

