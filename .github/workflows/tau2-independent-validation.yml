          print(f"- Eligible write scenarios: {scope['eligible_write_scenarios']}")
          print(f"- Oracle failures: {matrix['true_block'] + matrix['missed_failure']}")
          print(f"- Failure recall: {metrics['failure_recall']:.2%}")
          print(f"- False alarm rate: {metrics['false_alarm_rate']:.2%}")
          print(f"- Results SHA-256: {report['provenance']['results']['results_sha256']}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tau2-prospective-o4-retail
          path: work/tau2-prospective/

