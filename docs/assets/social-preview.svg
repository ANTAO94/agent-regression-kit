<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Agent Regression Kit compares a reviewed agent trace with a changed run and blocks a wrong tool argument in CI">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#102b39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e6c2"/>
      <stop offset="1" stop-color="#4bb4ff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1128" cy="74" r="250" fill="#48d8cf" opacity=".055"/>
  <circle cx="119" cy="623" r="200" fill="#4bb4ff" opacity=".05"/>

  <rect x="72" y="61" width="12" height="12" rx="3" fill="#57e6c2"/>
  <rect x="91" y="61" width="12" height="12" rx="3" fill="#4bb4ff"/>
  <text x="118" y="74" fill="#9fc7d3" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">OPEN SOURCE  /  PYTHON  /  MCP</text>

  <text x="72" y="166" fill="#f4f8fb" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">Agent Regression Kit</text>
  <text x="72" y="224" fill="#a9c2ce" font-family="Arial, sans-serif" font-size="30">Catch agent regressions before merge.</text>

  <rect x="72" y="276" width="530" height="235" rx="18" fill="#142f3f" stroke="#35616c" stroke-width="2"/>
  <rect x="93" y="296" width="145" height="37" rx="9" fill="#214b4c"/>
  <text x="113" y="322" fill="#75ebcb" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">BASELINE</text>
  <text x="103" y="383" fill="#e9f4f6" font-family="Menlo, Consolas, monospace" font-size="25">get_order("123")</text>
  <text x="103" y="426" fill="#9fc7d3" font-family="Menlo, Consolas, monospace" font-size="24">status: not_shipped</text>
  <rect x="103" y="452" width="104" height="38" rx="9" fill="#1a615b"/>
  <text x="129" y="478" fill="#baf7df" font-family="Arial, sans-serif" font-size="21" font-weight="700">PASS</text>

  <path d="M622 394h36m-14-14 14 14-14 14" fill="none" stroke="#7fb9c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="678" y="276" width="530" height="235" rx="18" fill="#253140" stroke="#8a5666" stroke-width="2"/>
  <rect x="699" y="296" width="160" height="37" rx="9" fill="#544253"/>
  <text x="719" y="322" fill="#ffafaa" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">CANDIDATE</text>
  <text x="709" y="383" fill="#f4edf0" font-family="Menlo, Consolas, monospace" font-size="25">get_order("132")</text>
  <text x="709" y="426" fill="#d4aab4" font-family="Menlo, Consolas, monospace" font-size="24">wrong order_id</text>
  <rect x="709" y="452" width="100" height="38" rx="9" fill="#834554"/>
  <text x="739" y="478" fill="#ffe0dd" font-family="Arial, sans-serif" font-size="21" font-weight="700">FAIL</text>

  <path d="M72 557h1136" stroke="#4c6e78" stroke-width="2" opacity=".65"/>
  <text x="72" y="596" fill="url(#accent)" font-family="Arial, sans-serif" font-size="24" font-weight="700">TRACE  →  BUSINESS CONTRACT  →  CI GATE</text>
  <text x="1208" y="596" fill="#9fc7d3" font-family="Arial, sans-serif" font-size="19" text-anchor="end">github.com/ANTAO94/agent-regression-kit</text>
</svg>
